<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page</title>

  <!-- Embed tracker.js: page views are auto-tracked, and window.swa.action()
       becomes available for call-to-action tracking. -->
  <script defer data-api="http://127.0.0.1:3330" src="http://127.0.0.1:3330/tracker.js"></script>
</head>
<body>
  <h1>Analytics Test</h1>

  <!-- Download: name="download", label="<platform> <version>" -->
  <a href="app.dmg" onclick="swa.action('download', 'macos 2.0')">Download App</a>

  <!-- Other call-to-action examples -->
  <button onclick="swa.action('signup')">Sign up</button>
  <button onclick="swa.action('login', 'google-oauth')">Log in with Google</button>
</body>
</html>
